name: Release

# One trigger releases everything. Running this workflow (workflow_dispatch) opens or
# refreshes the Release PR, gates it, merges it, creates the version tag and the GitHub
# Release, and publishes to npm with provenance. Ordinary pushes to main run only CI
# (ci.yml): this workflow is NOT triggered by a push.
#
# The merge runs inside this same run on purpose: a merge made with the workflow's
# GITHUB_TOKEN does not trigger another workflow run, so release-please is invoked a
# second time after the merge to create the tag and the release.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # create the version tag and the GitHub Release
      issues: write # release-please labels the Release PR as it opens/updates it
      pull-requests: write # open and merge the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.open.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.open.outputs.tag_name }}
    steps:
      # Opens or refreshes the Release PR. When there is nothing to release, no PR is
      # created and the steps that need one are skipped.
      - name: Open or refresh the Release PR
        id: open
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      # A release that does not pass the gate must never be merged: check out the
      # Release PR head and run the full gate first. The merge is what lands the version
      # bump on main, so gating here keeps a broken bump off main and keeps
      # release-please from ever tagging a tree that fails (no orphan tag/Release).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.open.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.open.outputs.pr).headBranchName }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.open.outputs.prs_created == 'true' }}
        with:
          node-version-file: .nvmrc
          # A publishing chain: never cache, so a poisoned cache cannot reach the tag.
          package-manager-cache: false
      - name: Gate the Release PR head
        if: ${{ steps.open.outputs.prs_created == 'true' }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run gate
      # The gate proves the tree builds and passes; this proves the *release* is coherent:
      # every versioned artifact carries the version release-please computed, every `bin`
      # is in the tarball, and the changelog's top heading either is `Unreleased` or names
      # exactly that version. A hand-cut heading that disagrees has to fail here — before
      # the merge, the tag and the publish — not after them.
      - name: Release preflight
        if: ${{ steps.open.outputs.prs_created == 'true' }}
        run: npm run release:check
      # The gate is green; merge the version bump. The branch is left in place: the
      # release-please PR is the same branch every release, and deleting it in the same
      # run makes the pull_request CI run fail to start ("workflow file issue").
      - name: Merge the Release PR
        if: ${{ steps.open.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.open.outputs.pr }}
        run: |
          number=$(echo "$PR" | jq -r '.number')
          gh pr merge "$number" --squash
          for _ in $(seq 1 30); do
            [ "$(gh pr view "$number" --json state --jq '.state')" = "MERGED" ] && break
            sleep 2
          done
      # The merge is on main and passes the gate; release-please tags the version and
      # creates the GitHub Release. It runs even when no PR was created, so a re-run
      # can create a release whose tag is still missing. Its outputs drive the publish
      # job.
      - name: Create the tag and the GitHub Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    name: publish to npm
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The npm Trusted Publisher is bound to the environment name `npm`, so the OIDC
    # token carries it. This environment has no required reviewers, so the publish
    # needs no approval.
    environment: npm
    permissions:
      contents: read # read the release tag's contents
      id-token: write # npm Trusted Publishing: the OIDC token replaces an NPM_TOKEN secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # No cache in a publishing job: a poisoned cache must never reach the
          # package that is published (zizmor cache-poisoning).
          package-manager-cache: false
      # No install scripts: this job holds `id-token: write`, so a lifecycle script
      # from a (transitive) dependency could mint the npm-publish OIDC token and
      # publish on our behalf. The package's own build scripts still run: `npm pack`
      # and `npm publish` below invoke `prepack`/`prepublishOnly` as usual.
      - run: npm ci --ignore-scripts
      # The published artifact is verified before it leaves: every `bin` declared in
      # package.json must be in the packed tarball, so a release can never ship a
      # broken package.
      - name: Verify the packed bin entry points
        run: |
          npm pack
          tarball=$(ls server-noonien-*.tgz)
          tar -tzf "$tarball" > files.txt
          grep -qx 'package/package.json' files.txt
          for entry in $(jq -r '.bin[]' package.json); do
            grep -qx "package/$entry" files.txt || {
              echo "::error::the tarball is missing the bin target $entry"
              exit 1
            }
          done
      # `npm publish` runs prepublishOnly (the full gate) and prepack (build); access
      # and provenance come from `publishConfig`, so no flag can drift here.
      - run: npm publish

  registry:
    name: publish to the MCP Registry
    needs: [release, publish]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # OIDC only: the registry authenticates the workflow identity, so no stored secret.
    permissions:
      contents: read
      id-token: write
    # The released version lives in the tagged tree: release-please bumps server.json and
    # the MCPB manifest in the Release PR (`extra-files`), and the registry validates that
    # tree. Nothing is rewritten here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      # Pinned by version and digest: this job holds the OIDC token that publishes to
      # the registry, so the binary it runs must be the one that was reviewed. Bump both
      # together — an older publisher is rejected ("invalid audience").
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -sSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "${base}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  ${RUNNER_TEMP}/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C . mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          set -o pipefail
          ./mcp-publisher login github-oidc
          # The registry validates the npm package version, and a freshly published
          # release can take a few minutes to appear on npm, so the first attempt can be
          # rejected with a 404 ("Wait and retry"). Retry that case only; fail at once on
          # anything else, so a genuine error is not masked.
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish 2>&1 | tee /tmp/registry-publish.log; then
              exit 0
            fi
            if ! grep -q -e "was not found (status: 404)" -e "Wait and retry" /tmp/registry-publish.log; then
              exit 1
            fi
            echo "npm has not exposed the released version yet; retrying in 60s (attempt $attempt/6)"
            sleep 60
          done
          echo "the npm version did not appear in time" >&2
          exit 1
